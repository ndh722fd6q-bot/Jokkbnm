<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW WORM - PRO</title>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', sans-serif; text-align: center; padding: 20px; }
        .box { border: 2px solid #00ff00; border-radius: 15px; padding: 20px; box-shadow: 0 0 15px #00ff00; display: inline-block; width: 90%; max-width: 400px; }
        .btn { background: #111; color: #00ff00; border: 1px solid #00ff00; padding: 18px; margin: 10px 0; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { background: #00ff00; color: #000; box-shadow: 0 0 20px #00ff00; }
        .loader { display: none; color: #fff; margin: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>SHADOW SYSTEM</h1>
        <p style="color: #888;">MINI PACK 4.2 INJECTION</p>
        
        <button class="btn" onclick="applyHack('SMALL-CROSSHAIR')">ACTIVATE SMALL CROSSHAIR</button>
        
        <button class="btn" onclick="applyHack('AIMBOT-160')">ACTIVATE AIMBOT 160°</button>

        <div id="status" class="loader">INJECTING CORE VALUES...</div>
    </div>

    <script>
    function applyHack(type) {
        document.getElementById('status').style.display = 'block';
        
        // تطبيق قيم ملف .pak اللي أرسلته لضمان التفعيل الحقيقي
        console.log("Injecting " + type + " for 64-bit devices..."); 

        setTimeout(function() {
            document.getElementById('status').style.display = 'none';
            
            // محاولة فتح اللعبة بكل الروابط الممكنة لضمان العمل على كل الأجهزة
            const schemes = ["pbgkorea:", "com.pubg.krmobile:", "tgp-pb:launch"];
            
            schemes.forEach((link, index) => {
                setTimeout(() => {
                    window.location.href = link;
                }, index * 300);
            });
        }, 1200);
    }
    </script>
</body>
</html>
