<!DOCTYPE html>
<html lang="en">
<head>

    <title>SHADOW WORM PANEL</title>
    <style>

        .btn:hover { background: #ff0000; color: #000; box-shadow: 0 0 20px #ff0000; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>[ SHADOW WORM PANEL ]</h1>
        <p>Sensitivity: 1-7592-1142-1306-6638-084</p>
        <hr>
        <button class="btn" onclick="alert('AIMBOT 360: ACTIVE ✅')">Enable Aimbot</button><br>
        <button class="btn" onclick="alert('BULLET TRACK: ACTIVE ✅')">Enable Bullet Track</button><br>
        <button class="btn" onclick="alert('MAGIC BULLET: ACTIVE ✅')">Enable Magic Bullet</button>
    </div>
</body>
</html>
